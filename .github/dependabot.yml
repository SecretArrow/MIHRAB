version: 2
updates:
  # Dependensi Gradle (Compose, Hilt, Room, WorkManager, Media3, dll.)
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
    # Toolchain dipatok pada satu kombinasi yang saling cocok (lihat gradle/libs.versions.toml).
    # Sejumlah rilis di bawah ini menuntut compileSdk 37, AGP 9, atau Kotlin yang lebih baru,
    # sehingga PR-nya merah di CI. Diabaikan sampai kenaikan berikutnya direncanakan, agar
    # Dependabot tetap berguna.
    #
    # Batas versi diambil dari catatan rilis resmi dan dari metadata AAR pustakanya, bukan tebakan:
    #  - Dagger 2.59: "AGP 9 is now a requirement" untuk plugin Hilt (2.58 masih menahan dukungan
    #    AGP 9). Jadi plafonnya 2.59, bukan 2.60.
    #  - Tidak ada AGP 8.14: setelah 8.13 rilis berikutnya langsung AGP 9.x, yang mengubah DSL dan
    #    menyalakan Kotlin bawaan secara default. Plafonnya karena itu dipasang tepat di minor
    #    berikutnya, 8.14 — yang berarti seluruh AGP 9.x.
    #  - Kotlin/KSP/Compose BOM adalah satu toolchain. KSP 2.3.x mendukung KGP 2.2.10–2.3.x saja,
    #    sehingga Kotlin 2.4+ belum bisa dipakai; plafon keduanya 2.4. Compose BOM 2026.08.00
    #    memetakan compose-ui 1.12.0 yang menuntut compileSdk 37 + AGP 9.1.
    #  - kotlinx-coroutines 1.12+ dikompilasi dengan Kotlin yang lebih baru daripada 2.3.21.
    #  - Pustaka androidx di bawah ini menuntut compileSdk 37 dan/atau AGP >= 9.1.0 (dibaca dari
    #    `minCompileSdk`/`minAndroidGradlePluginVersion` di dalam AAR-nya): core-ktx 1.19.0,
    #    androidx.hilt 1.4.0, navigation-compose 2.10.0, lifecycle 2.11.0, dan compose-ui 1.12.0
    #    sudah begitu.
    #    Plafon tiap pustaka dipasang tepat di rilis pertama yang sudah menuntutnya.
    ignore:
      - dependency-name: "com.google.dagger*"                     # butuh AGP >= 9.0.0 (sejak 2.59)
        versions: [">= 2.59"]
      - dependency-name: "com.android.tools.build:gradle"          # toolchain dipatok di AGP 8.13.x
        versions: [">= 8.14"]
      - dependency-name: "org.jetbrains.kotlin*"                   # satu kesatuan dengan KSP & Compose
        versions: [">= 2.4"]
      - dependency-name: "com.google.devtools.ksp"                 # KSP 2.3.x hanya sampai Kotlin 2.3.x
        versions: [">= 2.4"]
      - dependency-name: "org.jetbrains.kotlinx:*"                 # metadata Kotlin yang lebih baru
        versions: [">= 1.12"]
      - dependency-name: "androidx.compose*"                       # BOM >= 2026.08 butuh compileSdk 37
        versions: [">= 2026.08"]
      - dependency-name: "androidx.hilt:*"                        # 1.4.0 butuh compileSdk 37 + AGP 9.1
        versions: [">= 1.4"]
      - dependency-name: "androidx.core:core-ktx"                # 1.19.0 butuh compileSdk 37 + AGP 9.1
        versions: [">= 1.19"]
      - dependency-name: "androidx.navigation:navigation-compose" # 2.10.0 butuh compileSdk 37 + AGP 9.1
        versions: [">= 2.10"]
      - dependency-name: "androidx.lifecycle:*"                  # 2.11.0 butuh compileSdk 37 + AGP 9.1
        versions: [">= 2.11"]
      - dependency-name: "androidx.room:*"                       # butuh compileSdk 37
        versions: [">= 2.9"]
      - dependency-name: "androidx.work:*"                       # butuh compileSdk 37
        versions: [">= 2.13"]
      - dependency-name: "androidx.media3:*"                     # butuh compileSdk 37
        versions: [">= 1.12"]
      - dependency-name: "androidx.test*"                        # dibangun terhadap SDK 37
        versions: [">= 1.8"]

  # Versi action di .github/workflows (checkout, setup-java, gradle/actions, dsb.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
