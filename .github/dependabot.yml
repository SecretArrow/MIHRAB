version: 2
updates:
  # Dependensi Gradle (Compose, Hilt, Room, WorkManager, Media3, dll.)
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
    # Proyek sengaja dipatok pada compileSdk 34 + AGP 8.5.x (lihat app/build.gradle.kts).
    # Sejumlah rilis "minor" di bawah ini menuntut compileSdk 35/36 atau AGP 9, sehingga
    # PR-nya merah di CI (contoh: PR #20 — Hilt 2.60.1 menolak AGP < 9.0.0). Diabaikan
    # sampai upgrade toolchain direncanakan, agar Dependabot tetap berguna.
    ignore:
      - dependency-name: "com.google.dagger.hilt.android"        # butuh AGP >= 9.0.0
        versions: [">= 2.60"]
      - dependency-name: "com.google.dagger:hilt-android*"       # idem (runtime artifact)
        versions: [">= 2.60"]
      - dependency-name: "androidx.core:core-ktx"                # butuh compileSdk 35
        versions: [">= 1.15"]
      - dependency-name: "androidx.navigation:navigation-compose" # butuh compileSdk 35
        versions: [">= 2.9"]
      - dependency-name: "androidx.room:*"                       # butuh compileSdk 35
        versions: [">= 2.7"]
      - dependency-name: "androidx.work:*"                       # butuh compileSdk 35
        versions: [">= 2.10"]
      - dependency-name: "androidx.media3:*"                     # butuh compileSdk 35
        versions: [">= 1.5"]

  # Versi action di .github/workflows (checkout, setup-java, gradle/actions, dsb.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
