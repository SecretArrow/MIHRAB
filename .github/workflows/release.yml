name: Auto Release (tag v*)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag yang sudah ada (mis. v1.1.0) untuk benar-benar menerbitkan rilis.
          Kosongkan untuk sekadar menguji build rilis — tidak ada rilis yang terbit.
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6

      - name: Validasi konten (strict — wajib sumber resmi)
        run: python3 tools/validate_content.py --strict

      - name: Siapkan keystore dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release (signed bila secrets tersedia)
        run: ./gradlew :app:assembleRelease :app:bundleRelease --parallel --build-cache

      - name: Verifikasi tanda tangan (keystore rilis, bukan debug)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          # Pilih SATU apksigner, jangan biarkan glob memilih. `$ANDROID_HOME/build-tools/*/apksigner`
          # cocok ke lebih dari satu versi build-tools di runner GitHub; glob yang meleset ke banyak
          # berkas dipecah shell menjadi perintah + argumen, sehingga apksigner mengeluh
          # "Unsupported command: .../apksigner". Karena langkah ini terlewat selama
          # KEYSTORE_BASE64 masih kosong, cacat itu baru muncul setelah keystore tersedia.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner tidak ditemukan di \$ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"

          # Nama langkah ini menjanjikan tanda tangan keystore rilis. Jangan sekadar mencetak
          # sertifikat: bandingkan sidik jari penanda tangan APK dengan keystore yang barusan
          # didekode dari secret. Ini membuktikan rantai secret -> keystore -> APK utuh, dan
          # sekaligus menolak APK yang masih bertanda tangan debug.
          sidik_jks=$("$JAVA_HOME/bin/keytool" -list -v -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -m1 -i "SHA256:" | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr 'A-F' 'a-f')
          sidik_apk=$(grep -m1 -i "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt" \
            | sed 's/.*digest:[[:space:]]*//' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$sidik_jks" ] || [ "$sidik_jks" != "$sidik_apk" ]; then
            echo "::error::APK tidak bertanda tangan keystore rilis (jks='$sidik_jks' apk='$sidik_apk')"
            exit 1
          fi
          echo "OK: APK bertanda tangan keystore rilis ($sidik_apk)"

      - name: Versi di dalam APK cocok dengan tag rilis
        # Versi hidup di DUA tempat: `versionName` di app/build.gradle.kts (yang dibaca BuildConfig
        # dan tampil di layar Tentang) dan nama tag (yang menjadi nama rilis). Bila keduanya
        # menyimpang, rilis resmi menerbitkan APK yang di dalamnya mengaku versi lain — pengguna
        # melihat "1.0.0" pada rilis bernama v1.1.0 — dan tak ada satu pun langkah yang memeriksanya.
        # Dibandingkan, bukan diasumsikan, seperti sidik jari tanda tangan di langkah sebelumnya.
        # Berlaku hanya saat ref-nya memang tag (atau tag diminta eksplisit) supaya dispatch dari
        # cabang tetap boleh menjadi uji build.
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSI=$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts \
            | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$VERSI" ]; then
            echo "::error::versionName tidak terbaca dari app/build.gradle.kts"
            exit 1
          fi
          if [ "v$VERSI" != "$TAG" ]; then
            echo "::error::tag '$TAG' tidak cocok dengan versionName '$VERSI' (harusnya v$VERSI)"
            exit 1
          fi
          echo "OK: tag '$TAG' cocok dengan versionName '$VERSI'"

      - name: GitHub Release
        # Rilis hanya terbit bila ref-nya memang tag, atau bila tag diminta eksplisit saat
        # dispatch. Tanpa pembatas ini, `workflow_dispatch` dari cabang akan mencoba menerbitkan
        # rilis bernama cabang: action-gh-release menormalkan `github.ref_name` menjadi nama tag,
        # jadi pemicu yang dideklarasikan itu berujung sampah alih-alih berguna. Dengan pembatas
        # ini dispatch menjadi uji build rilis yang aman (tanpa menerbitkan apa pun), sedangkan
        # alur tag tidak berubah sama sekali.
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true

      - name: Bersihkan keystore
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
