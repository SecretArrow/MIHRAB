name: Auto Release (tag v*)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag yang sudah ada (mis. v1.0.1) untuk benar-benar menerbitkan rilis.
          Kosongkan untuk sekadar menguji build rilis — tidak ada rilis yang terbit.
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6

      - name: Validasi konten (strict — wajib sumber resmi)
        run: python3 tools/validate_content.py --strict

      - name: Siapkan keystore dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release (signed bila secrets tersedia)
        run: ./gradlew :app:assembleRelease :app:bundleRelease --parallel --build-cache

      - name: Verifikasi tanda tangan (bukan debug)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"

      - name: GitHub Release
        # Rilis hanya terbit bila ref-nya memang tag, atau bila tag diminta eksplisit saat
        # dispatch. Tanpa pembatas ini, `workflow_dispatch` dari cabang akan mencoba menerbitkan
        # rilis bernama cabang: action-gh-release menormalkan `github.ref_name` menjadi nama tag,
        # jadi pemicu yang dideklarasikan itu berujung sampah alih-alih berguna. Dengan pembatas
        # ini dispatch menjadi uji build rilis yang aman (tanpa menerbitkan apa pun), sedangkan
        # alur tag tidak berubah sama sekali.
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true

      - name: Bersihkan keystore
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
