name: Auto-fix (higiene teks)

# Kenapa ada: `plan.txt` baris 1 meminta "auto fix" sebagai bagian alur kerja. Alur kerja lama
# bernama sama hanya menjalankan `./gradlew tasks` — tanpa pemasang apa pun — sehingga tak pernah
# memperbaiki apa-apa dan sudah dihapus. Alur ini menjalankan pemasang yang nyata:
# `tools/format_teks.py --fix`, yang hanya menyentuh spasi dan baris baru (akhir baris LF, spasi
# ekor, baris kosong beruntun, tepat satu baris baru di akhir) sehingga tidak dapat mengubah
# perilaku aplikasi maupun isi teks keagamaan.
#
# Kenapa TIDAK dipicu oleh `pull_request` (padahal itu yang paling terasa "otomatis"): sudah
# dibuktikan empiris di PR #37. Bila bot meng-commit perbaikan ke cabang PR, GitHub membuat
# rangkaian run baru untuk commit itu dengan aktor `github-actions[bot]` — dan karena bot bukan
# kolaborator, run itu berhenti di `action_required` (menunggu persetujuan manusia) alih-alih
# berjalan. Akibatnya commit perbaikan **tidak pernah tervalidasi** lint/unit/build sampai
# seseorang menyetujuinya; itu melanggar prinsip "setiap commit yang digabung sudah lulus CI".
# Pemicu `pull_request` hanya akan bersih bila push memakai token yang aktornya kolaborator
# (PAT/GitHub App), dan token semacam itu sengaja tidak disimpan di repo ini.
#
# Maka pembagiannya: **gate di `ci.yml` yang mencegah** higiene kotor masuk lewat PR, dan **alur
# kerja ini yang memperbaiki** — dijalankan sengaja lewat `workflow_dispatch`, plus sapuan
# mingguan sebagai jaring pengaman untuk `main` (mis. bila ada yang men-push langsung tanpa PR).
# Sapuan itu hanya meng-commit bila memang ada temuan, dan karena gate menjaga `main` tetap
# bersih, biasanya selesai dalam hitungan detik tanpa perubahan.

on:
  workflow_dispatch:
  schedule:
    # Senin 02:23 WIB (Minggu 19:23 UTC). Menit sengaja bukan :00 — permintaan serentak dari
    # seluruh dunia menumpuk di menit bulat, dan jadwal ini tidak perlu presisi.
    - cron: '23 19 * * 0'

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  rapikan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Rapikan higiene teks
        run: python3 tools/format_teks.py --fix .
      - name: Buktikan hasilnya sudah bersih (periksa ulang)
        run: python3 tools/format_teks.py .
      - name: Commit dan push bila ada perubahan
        run: |
          if git diff --quiet; then
            echo "Tidak ada yang perlu dirapikan — berkas sudah bersih."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(rapikan): higiene teks otomatis

          Dijalankan oleh .github/workflows/autofix.yml memakai tools/format_teks.py.
          Hanya spasi dan baris baru; tidak ada isi yang berubah.

          Co-Authored-By: [CC] <noreply@anthropic.com>"
          git push origin "HEAD:${{ github.ref_name }}"
