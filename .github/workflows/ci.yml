name: CI (hemat — lint + unit)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint debug (hemat, tanpa emulator)
        run: ./gradlew :app:lintDebug --parallel --build-cache
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: lint-report, path: app/build/reports/lint-results-debug.html }

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit test (qiblat + konten resmi + ghaib)
        run: ./gradlew :app:testDebugUnitTest --parallel --build-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-report, path: app/build/reports/tests/testDebugUnitTest/ }

  debug-apk:
    needs: [lint, unit]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug --parallel --build-cache
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: app/build/outputs/apk/debug/*.apk }
