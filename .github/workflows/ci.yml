name: CI (hemat — lint + unit + build)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pemeriksaan dependensi (plan.txt: "Lint dan pemeriksaan dependensi") dilakukan oleh
# Dependabot — lihat .github/dependabot.yml. Ia memantau dependensi Gradle (termasuk
# libs.versions.toml) dan versi action, membuka PR pembaruan mingguan, serta memunculkan
# peringatan kerentanan di tab Security. Tidak ada job CI tambahan yang perlu dijalankan
# berulang untuk hal yang sudah ditangani GitHub secara berkelanjutan.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Validasi konten JSON (strict — wajib sumber resmi, SOURCES.md)
        run: python3 tools/validate_content.py --strict
      - name: "Periksa berkas workflow dapat dibaca (gate juga ada di workflow-lint.yml)"
        run: python3 tools/check_workflows.py
      - name: "Higiene komentar Kotlin (mencegah galat kompilasi karena komentar tertutup awal)"
        run: python3 tools/check_kotlin_lex.py app/src
      - name: "Higiene teks (akhir baris LF, tanpa spasi ekor, tepat satu baris baru di akhir)"
        run: python3 tools/format_teks.py .
      - name: "Validasi gate bundel pembaruan konten (fixture sah lolos, cacat ditolak)"
        run: |
          python3 tools/validate_bundle.py --strict tools/fixtures/bundel/sah.json
          python3 tools/validate_bundle.py --strict --harus-gagal tools/fixtures/bundel/cacat.json
          python3 tools/validate_bundle.py --strict --harus-gagal tools/fixtures/bundel/bacaan-cacat.json
      - name: Lint debug (hemat, tanpa emulator)
        run: ./gradlew :app:lintDebug --parallel --build-cache
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: lint-report, path: app/build/reports/lint-results-debug.html }

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit test (jadwal, kiblat, hijriah, konten, repo)
        run: ./gradlew :app:testDebugUnitTest --parallel --build-cache
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: unit-report, path: app/build/reports/tests/testDebugUnitTest/ }

  build:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --parallel --build-cache
      - name: Build release (validasi R8/ProGuard; unsigned bila tanpa keystore)
        run: ./gradlew :app:assembleRelease --parallel --build-cache
      - uses: actions/upload-artifact@v7
        with: { name: app-debug, path: app/build/outputs/apk/debug/*.apk }
