name: CI (hemat — lint + unit + build)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Validasi konten JSON (sumber resmi — SOURCES.md)
        run: python3 tools/validate_content.py
      - name: Lint debug (hemat, tanpa emulator)
        run: ./gradlew :app:lintDebug --parallel --build-cache
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: lint-report, path: app/build/reports/lint-results-debug.html }

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit test (jadwal, kiblat, hijriah, konten, repo)
        run: ./gradlew :app:testDebugUnitTest --parallel --build-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-report, path: app/build/reports/tests/testDebugUnitTest/ }

  build:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --parallel --build-cache
      - name: Build release (validasi R8/ProGuard; unsigned bila tanpa keystore)
        run: ./gradlew :app:assembleRelease --parallel --build-cache
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: app/build/outputs/apk/debug/*.apk }
