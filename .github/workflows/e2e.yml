name: E2E (mahal — hanya main/nightly/label e2e)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-main
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Instrumented test di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: adb wait-for-device && sleep 90 && ./gradlew :app:connectedDebugAndroidTest --parallel --build-cache
