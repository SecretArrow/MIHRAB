name: E2E (mahal — hanya main/nightly/label e2e)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-main
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6

      # Bangun APK uji SEBELUM emulator menyala. Kompilasi (Kotlin/KSP/Hilt) di runner
      # 2-vCPU berebut CPU dengan emulator dan membuat emulator mendadak tak responsif
      # (ShellCommandUnresponsiveException → "Unknown API Level" → 0 perangkat cocok).
      # Dengan membangun lebih dulu, tugas emulator hanya memasang & menjalankan uji.
      - name: Bangun APK uji (tanpa emulator)
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --build-cache

      - name: Instrumented test di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          # -memory 4096: RAM bawaan AVD (1,5 GB) membuat emulator tertekan saat Gradle
          # berjalan berdampingan, dan itulah yang memicu kegagalan "Unknown API Level".
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 4096 -camera-back none -camera-front none
          # Aksi ini menjalankan SETIAP BARIS script sebagai `sh -c` terpisah, jadi
          # loop/fungsi multi-baris tidak akan utuh. Seluruh logika ada di berkas
          # .github/scripts/e2e-instrumented.sh dan dipanggil sebagai satu baris.
          script: bash .github/scripts/e2e-instrumented.sh
