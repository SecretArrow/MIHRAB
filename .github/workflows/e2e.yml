name: E2E (mahal — hanya main/nightly/label e2e)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-main
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Instrumented test di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            # Nyalakan & tunggu daemon adb; kegagalan "Unable to connect to adb daemon"
            # membuat connectedAndroidTest melihat 0 perangkat.
            adb start-server
            adb wait-for-device
            # Tunggu boot selesai (bukan sleep tetap) agar tidak membuang waktu.
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do sleep 2; done
            # Pastikan adb sudah bisa membaca properti sebelum Gradle berjalan —
            # jika tidak, AGP melewati perangkat dengan "Unknown API Level".
            until [ -n "$(adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r')" ]; do sleep 2; done
            ./gradlew :app:connectedDebugAndroidTest --parallel --build-cache
