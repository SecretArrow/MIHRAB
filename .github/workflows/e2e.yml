name: E2E (mahal — hanya main/nightly)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  # Grup per-ref: percobaan di branch/PR tidak boleh membatalkan verifikasi `main`,
  # dan sebaliknya. Sebelumnya grup global ("e2e-main") membuat dispatch branch
  # men-cancel run main yang sedang berjalan.
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6

      # Bangun APK uji SEBELUM emulator menyala. Kompilasi (Kotlin/KSP/Hilt) di runner
      # 2-vCPU merebut CPU dari emulator, dan emulator yang kelaparan CPU menjawab perintah
      # adb lebih lambat daripada batas waktu ddmlib. Dengan membangun lebih dulu — hasilnya
      # tetap terpakai lewat `--build-cache` di langkah uji — emulator hanya perlu memasang
      # dan menjalankan uji.
      - name: Bangun APK uji (tanpa emulator)
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --build-cache

      # Akselerasi perangkat keras: `/dev/kvm` ADA di runner, tetapi pengguna `runner` tidak
      # berhak membukanya — emulator sendiri melaporkannya (`ProbeKVM: This user doesn't have
      # permissions to use KVM (/dev/kvm)`). Aksi emulator memutuskan lewat
      # `accessSync('/dev/kvm', R_OK | W_OK)`, jadi pemeriksaan itu gagal dan emulator dipaksa
      # berjalan dengan `-accel off` — emulasi perangkat lunak yang begitu lambat sampai
      # pembacaan properti ddmlib melewati batas waktunya dan AGP melewati perangkat
      # ("Unknown API Level"). Membuka izinnya SEBELUM aksi emulator dipanggil membuat
      # pemeriksaan itu lulus dan `-accel off` tidak lagi dipaksakan.
      # Semua perintah dijaga `|| true`: bila /dev/kvm memang tidak ada, langkah ini tidak
      # boleh menjatuhkan job — emulator hanya kembali ke jalur lambat.
      - name: Buka akses KVM (percepat emulator)
        run: |
          echo "nproc=$(nproc)"
          id
          ls -l /dev/kvm || true
          sudo chmod 666 /dev/kvm || true
          sudo gpasswd -a "$USER" kvm || true
          ls -l /dev/kvm || true

      - name: Instrumented test di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          # -memory 4096: RAM bawaan AVD (1,5 GB) sempit untuk API 29 plus aplikasi yang diuji,
          # sehingga tamu (guest) bisa tertekan. Ini bukan sebab kegagalan "Unknown API Level" —
          # sebabnya akselerasi yang tidak terbuka (lihat langkah KVM di atas) — melainkan
          # mengurangi satu lagi sumber kelambatan.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 4096 -camera-back none -camera-front none
          # Aksi ini menjalankan SETIAP BARIS script sebagai `sh -c` terpisah, jadi
          # loop/fungsi multi-baris tidak akan utuh. Seluruh logika ada di berkas
          # .github/scripts/e2e-instrumented.sh dan dipanggil sebagai satu baris.
          script: bash .github/scripts/e2e-instrumented.sh
